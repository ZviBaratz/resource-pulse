name: CI

on:
  workflow_dispatch:  # Allow manual triggering
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only for every job, written here rather than left to the repository's
# default, so the file says what its token can do. A job that needs more grants
# it itself.
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck on all shell scripts
        run: |
          # Find shell scripts with shebangs
          scripts=$(find . \( -name "*.sh" -o -name "*.bash" -o -name "*.zsh" \) -print0 | \
                    xargs -0 grep -l "^#!" 2>/dev/null || true)

          # This repository always has shell scripts, so finding none means the
          # search broke, and a lint over nothing must not read as a pass.
          if [ -n "$scripts" ]; then
            echo "Checking scripts: $scripts"
            echo "$scripts" | xargs shellcheck -x
          else
            echo "::error title=ShellCheck::no shell scripts found to check"
            exit 1
          fi

  # Every hook in .pre-commit-config.yaml, over every file, so a pull request
  # meets the hooks a local commit does: among them the pinned shellcheck under
  # its memory bound (scripts/shellcheck-bounded.sh), the end-of-file,
  # whitespace and conflict-marker hooks, and the row-total checker. A hook that
  # fails, or that changes a file, makes pre-commit exit non-zero, and so the
  # step and the job fail.
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The shellcheck hook needs Python 3.10 or later. No apt package: each
      # hook brings its own tool (pre-commit installs Go for the gitleaks hook
      # when the runner has none), and the wrapper's prlimit is util-linux,
      # already on the runner image.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      # --show-diff-on-failure: when a fixing hook changes a file, the log shows
      # the change it wanted.
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    # On a pull request the action lists the PR's commits through the API, which
    # needs pull-requests: read; the workflow's own grant above is contents
    # only. Nothing here writes, so the comments the action would post on a
    # finding (pull-requests: write) are off: a finding fails the job, and the
    # job's log and summary name it.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      # A repository on a personal account needs no GITLEAKS_LICENSE; an organization's would.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  resource-pulse-test:
    name: Resource Pulse State Tables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No zsh: bash runs the status script (scripts/resource-pulse-status.sh)
      # against stubs, and no table here needs zsh. The real
      # gdbus (libglib2.0-bin) asks the real cockpit service on a private bus.
      # dbus-daemon ships /usr/bin/dbus-run-session (on 24.04 and 26.04 alike):
      # the D-Bus rows (the sampler's test double, the cockpit's face and the
      # clients of both) and the cockpit's entry point run on a private bus of
      # their own, never on a session bus the runner may have. systemd-analyze,
      # which verifies the service unit, ships with systemd on ubuntu-latest.
      # The card-width row measures the card's text with Pango (gjs does not
      # pull its typelibs in) in the card's own font, Ubuntu Sans. jq: the
      # four nested tables exit 2 without it. ripgrep: the source and status
      # tables exit 2 without it.
      - name: Install gjs, dbus-daemon, gdbus, Pango's typelibs, Ubuntu Sans, jq and ripgrep
        uses: ./.github/actions/apt-install
        with:
          packages: gjs dbus-daemon libglib2.0-bin gir1.2-pango-1.0 fonts-ubuntu jq ripgrep

      # Each table runs even when an earlier one failed, so one red table hides no other's rows.
      - name: Run the Resource Pulse gjs unit-test table (run.js)
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-gjs.sh

      - name: Run the Resource Pulse source state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-source.sh

      - name: Run the Resource Pulse cost state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-cost.sh

      - name: Run the Resource Pulse private-bus state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-bus.sh

      # CI is set by Actions: without it, a missing systemd-analyze leaves the unit rows passing with nothing verified.
      - name: Run the Resource Pulse units state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-units.sh

      - name: Run the Resource Pulse status state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-status.sh

      - name: Run the Resource Pulse nested harness state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-nested.sh

      - name: Run the Resource Pulse nested runs state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-nested-runs.sh

      - name: Run the Resource Pulse nested check state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-nested-check.sh

      - name: Run the Resource Pulse nested signals state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-nested-signals.sh

  resource-pulse-sampler-test:
    name: Resource Pulse Sampler State Tables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The sampler's tables run gjs: the constants comparison against lib/constants.js and lib/protocol.js, the
      # program's bus rows (the test double's conformance row among them) and GLib's own app names.
      # dbus-daemon ships /usr/bin/dbus-run-session, which the bus table runs the program under, on a
      # private bus of its own, never on a session bus the runner may have; libglib2.0-bin brings gdbus.
      # cargo, rustfmt, clippy and rustdoc come with ubuntu-latest; the first build downloads the crates from crates.io.
      # ripgrep: every table but the release table searches with rg and exits 2 without it.
      # tzdata: the clock-label row runs the program under TZ=Asia/Tokyo and needs that zone's file.
      # zsh: the build step runs the --build-limits-module module under it for its job cap, so every build row links
      # it, and the build table's job-cap row runs a fixture module under it.
      - name: Install gjs, dbus-daemon, gdbus, ripgrep and zsh
        uses: ./.github/actions/apt-install
        with:
          packages: gjs dbus-daemon libglib2.0-bin ripgrep tzdata zsh

      - name: Check the crate's formatting
        run: cargo fmt --check --manifest-path resource-pulse-sampler/Cargo.toml

      # --all-targets lints the tests too (src/**/tests.rs and tests/), which a plain clippy run never compiles.
      - name: Lint the crate and its tests
        run: cargo clippy --all-targets --locked --manifest-path resource-pulse-sampler/Cargo.toml -- -D warnings

      # Private items too: nearly every item here is crate-private, and a public-only run would read few of the docs.
      # A broken intra-doc link, or any other rustdoc warning, in any item's doc fails the job.
      - name: Document the crate and its private items, failing on any warning
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --locked --manifest-path resource-pulse-sampler/Cargo.toml

      # Each table runs even when an earlier step failed, so one red table hides no other's rows. The first builds the
      # program into the checkout's cargo build directory, where each later one finds it built.
      - name: Run the Resource Pulse sampler cargo and program state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-sampler.sh

      - name: Run the Resource Pulse sampler constants state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-sampler-constants.sh

      - name: Run the Resource Pulse sampler private-bus state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-sampler-bus.sh

      - name: Run the Resource Pulse sampler source-hash state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-sampler-hash.sh

      - name: Run the Resource Pulse sampler build step state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-sampler-build.sh

      - name: Run the Resource Pulse sampler release program state table
        if: ${{ !cancelled() }}
        run: ./scripts/test-resource-pulse-sampler-release.sh

  repo-checks-test:
    name: Repository Checks State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # PyYAML reads the shellcheck hook out of .pre-commit-config.yaml, and
      # this workflow's steps, with a real parser rather than by their text.
      - name: Install PyYAML
        uses: ./.github/actions/apt-install
        with:
          packages: python3-yaml

      - name: Run the repository checks state table
        run: ./scripts/test-repo-checks.sh

  shellcheck-bounded-test:
    name: Bounded ShellCheck Wrapper State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No extra packages: prlimit is util-linux, already on the runner image.
      # prlimit and shellcheck are STUBBED on a PATH without /usr/bin, so a row
      # reads what the wrapper passed, never what this runner has installed.
      # The real-prlimit rows give the runner's prlimit a stub shellcheck that
      # prints `ulimit -v`, so no row ever runs shellcheck itself.
      - name: Run the bounded shellcheck state table
        run: ./scripts/test-shellcheck-bounded.sh

  state-table-totals-test:
    name: State-Table Row-Total Guard State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No extra packages: the checker is grep and sed over scripts/test-*.sh,
      # and the suite builds its fixture trees with printf. A new external tool
      # in a checker is a new way for it to go quiet, so this one has none.
      - name: Run the state-table row-total state table
        run: ./scripts/test-state-table-totals.sh

      # The guard itself, over the tree we actually ship. The suite above covers
      # this too, in its integration rows, but a failure there reads as "the
      # state table is broken" while a failure here reads as "a suite has no row
      # total" -- and the second is the one a contributor needs to see named.
      # So it runs even when the suite above failed; the job still fails then.
      - name: Run the state-table row-total guard
        if: ${{ !cancelled() }}
        run: ./scripts/check-state-table-totals.sh
